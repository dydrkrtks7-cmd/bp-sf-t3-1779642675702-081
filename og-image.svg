<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="690" cy="2" r="28" fill="#1565c0" opacity="0.10"/>
    <circle cx="799" cy="545" r="67" fill="#1565c0" opacity="0.17"/>
    <circle cx="131" cy="180" r="33" fill="#1565c0" opacity="0.16"/>
    <circle cx="389" cy="-77" r="63" fill="#1565c0" opacity="0.07"/>
    <circle cx="368" cy="51" r="23" fill="#1565c0" opacity="0.18"/>
    <circle cx="937" cy="229" r="78" fill="#1565c0" opacity="0.18"/>
    <rect x="487" y="405" width="54" height="60" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(10, 612, 116)"/>
    <rect x="-70" y="263" width="90" height="54" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(31, 875, 237)"/>
    <rect x="491" y="702" width="56" height="31" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(26, 736, -87)"/>
    <rect x="576" y="333" width="29" height="32" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(7, 1013, 5)"/>
    <rect x="953" y="-54" width="93" height="93" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(41, 869, 81)"/>
    <rect x="730" y="466" width="69" height="35" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(9, -74, 192)"/>
    <rect x="923" y="552" width="42" height="52" rx="8" fill="#0d47a1" opacity="0.07" transform="rotate(23, 682, 477)"/>
    <rect x="-13" y="504" width="75" height="78" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(13, 609, 493)"/>
    <polygon points="66,418 102,490 30,490" fill="#1565c0" opacity="0.05"/>
    <polygon points="691,194 784,380 598,380" fill="#1565c0" opacity="0.07"/>
    <polygon points="1163,203 1190,257 1136,257" fill="#1565c0" opacity="0.07"/>
    <polygon points="193,131 246,237 140,237" fill="#1565c0" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,538 C360,584 840,492 1200,538 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    PBN 빌더
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 주식투자
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 PBN 빌더 — 주식투자
  </text>
</svg>